<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC Reader</title>
<style>
body {
  background: #11111f;
  color: white;
  font-family: system-ui, sans-serif;
  padding: 20px;
  max-width: 650px;
  margin: auto;
}
h1 { color: #b9a6ff; }
button {
  width: 100%;
  padding: 15px;
  margin: 6px 0;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  background: #b9a6ff;
  color: #171027;
}
button:disabled { opacity: .5; }
.panel {
  background: #201e32;
  padding: 18px;
  margin-top: 18px;
  border-radius: 16px;
  overflow-wrap: anywhere;
}
#status { color: #c8baff; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.record {
  background: #141322;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>
<body>

<h1> NFC Reader</h1>
<p>Tap Start scanning and grant access when your browser asks.</p>

<div class="panel">
  <button id="start">Request NFC Access & Scan</button>
  <button id="stop" disabled>Stop scanning</button>
  <p id="status">NFC access has not been requested.</p>
</div>

<div class="panel">
  <h2>Tag information</h2>
  <div id="results">No tags scanned yet.</div>
</div>

<script>
const start = document.querySelector("#start");
const stop = document.querySelector("#stop");
const status = document.querySelector("#status");
const results = document.querySelector("#results");

let controller;

function showRecord(title, value) {
  const box = document.createElement("div");
  box.className = "record";

  const heading = document.createElement("strong");
  heading.textContent = title;

  const content = document.createElement("pre");
  content.textContent = value;

  box.append(heading, content);
  results.prepend(box);
}

start.addEventListener("click", async () => {
  if (!("NDEFReader" in window)) {
    status.textContent =
      "NFC is unsupported here. Use a compatible Android browser over HTTPS.";
    return;
  }

  start.disabled = true;
  status.textContent = "Requesting NFC access...";

  try {
    const reader = new NDEFReader();
    controller = new AbortController();

    // Requests browser-managed NFC permission and starts scanning.
    await reader.scan({ signal: controller.signal });

    stop.disabled = false;
    status.textContent =
      "NFC access granted. Hold a tag near your phone.";

    reader.addEventListener("reading", event => {
      if (results.textContent === "No tags scanned yet.") {
        results.textContent = "";
      }

      showRecord(
        "Tag ID",
        event.serialNumber || "Not provided by browser"
      );

      showRecord(
        "Record count",
        String(event.message.records.length)
      );

      event.message.records.forEach((record, index) => {
        let value;
        const type = record.recordType;

        try {
          if (type === "text") {
            value = new TextDecoder(
              record.encoding || "utf-8"
            ).decode(record.data);
          } else if (type === "url" || type === "absolute-url") {
            value = new TextDecoder().decode(record.data);
          } else {
            const bytes = new Uint8Array(record.data || []);
            value = "Binary data (" + bytes.length + " bytes)\n";
            value += Array.from(bytes, b =>
              b.toString(16).padStart(2, "0")
            ).join(" ");
          }
        } catch {
          value = "Could not decode this record.";
        }

        showRecord(
          "Record " + (index + 1) + " — " + type,
          value || "(empty record)"
        );
      });

      status.textContent = "Tag read successfully!";
    });

    reader.addEventListener("readingerror", () => {
      status.textContent =
        "A tag was detected, but its data could not be read.";
    });

    controller.signal.addEventListener("abort", () => {
      start.disabled = false;
      stop.disabled = true;
      status.textContent = "Scanning stopped.";
    }, { once: true });

  } catch (error) {
    start.disabled = false;
    stop.disabled = true;

    if (error.name === "NotAllowedError") {
      status.textContent =
        "NFC permission denied. Allow NFC access in your browser and try again.";
    } else {
      status.textContent = error.name + ": " + error.message;
    }
  }
});

stop.addEventListener("click", () => {
  if (controller) controller.abort();
});
</script>

</body>
</html>
